# Installed by singbox-cli to /etc/systemd/networkd.conf.d/
#
# THE root-cause fix for "sing-box is running, sb-tun exists, and traffic still
# leaves unproxied".
#
# systemd-networkd's ManageForeignRoutingPolicyRules= defaults to YES, and that
# default means: networkd takes ownership of routing policy rules created by
# OTHER programs and removes the ones it does not recognise. sing-box's
# auto_route installs exactly such rules (priorities 9000-9010, feeding table
# 2022). So every networkd reload — a network change, a resume from suspend, a
# `systemctl restart systemd-networkd` — can delete them.
#
# The failure that follows is silent, which is what makes it worth a file:
# the sing-box process keeps running, sb-tun keeps existing, the route table
# keeps its default route, and only the rules that FEED that table are gone.
# Nothing is logged by anyone, and every host process quietly falls back to the
# physical interface.
#
# Setting this to `no` tells networkd to leave foreign rules alone. It does not
# stop networkd managing its OWN rules, and it changes nothing for a host that
# does not run networkd at all.
#
# Same class of problem, same fix, elsewhere: netbirdio/netbird#4578.
# sing-box cannot repair this itself — its Linux TUN backend installs these
# rules once at start-up and never re-checks them (unlike its own nftables
# path, which reconciles). Tailscale, which solved the same problem, subscribes
# to netlink rule-deletion events and reinstalls; see
# tailscale/tailscale@b3af74e "restore Linux ip rules when systemd deletes them".
#
# Remove this file (and reload networkd) to go back to the distribution default.
[Network]
ManageForeignRoutingPolicyRules=no
